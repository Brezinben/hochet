[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt" }
hk = "2.12.0"
jactionlint = "2.5.0"
# jactionlint runs it on each `run:` block, and skips that check when none is on the PATH.
shellcheck = "0.11.0"
"github:Boshen/cargo-shear" = "1.14.0"

[tasks.build]
description = "Build the debug binary"
run = "cargo build --all-targets"

[tasks.test]
description = "Run the integration tests"
run = "cargo test --all-targets"

[tasks.lint]
description = "Check format, clippy and unused dependencies"
run = ["cargo fmt --all --check", "cargo clippy --all-targets -- -D warnings", "cargo-shear --deny-warnings"]

[tasks.lint-fix]
description = "Apply the format and the clippy fixes"
run = ["cargo fmt --all", "cargo clippy --all-targets --fix --allow-dirty --allow-staged -- -D warnings"]

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "test"]
