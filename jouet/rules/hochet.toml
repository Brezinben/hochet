#:schema https://jouet.jdx.dev/schema/rules.json
[[rule]]
name = "heavy"
why = "Several agents that build, type-check or run test suites at once fill the memory or the disk and crash WSL."
mode = "deny"
scope = "plugin"
author = "setup-quality-tooling"
created = "2026-11-13"
message = "This command is heavy: it goes through the machine-wide queue, which runs HOCHET_SLOTS heavy commands at a time (default 2). Prefix it with hochet. While it waits, hochet prints its place; `hochet status` lists who holds each slot."
suggest = "hochet <the command>"

[[rule.match]]
command = "playwright test"
[[rule.match]]
command = "stryker run"
[[rule.match]]
command = "vitest run"
text = ["^browser$|^contract$|^--project=(browser|contract)$"]
[[rule.match]]
command = "cargo build"
[[rule.match]]
command = "cargo test"
[[rule.match]]
command = "cargo check"
[[rule.match]]
command = "cargo clippy"
[[rule.match]]
command = "cargo nextest"
[[rule.match]]
command = "tsc"
[[rule.match]]
command = "jest"
# A package manager runs a script by its first word: a matcher on any argument would deny `yarn add jest`.
[[rule.match]]
command = "yarn"
max_args = 0
[[rule.match]]
command = "yarn install"
[[rule.match]]
command = "yarn tsc"
[[rule.match]]
command = "yarn jest"
[[rule.match]]
command = "yarn test*"
[[rule.match]]
command = "yarn build*"
[[rule.match]]
command = "yarn run test*"
[[rule.match]]
command = "yarn run build*"
[[rule.match]]
command = "yarn workspace * tsc"
[[rule.match]]
command = "yarn workspace * test*"
[[rule.match]]
command = "yarn workspace * build*"
[[rule.match]]
command = "hk check"
[[rule.match]]
command = "pnpm install"
[[rule.match]]
command = "npm install"
[[rule.match]]
command = "bun install"
[[rule.match]]
command = "bun run tsc"
[[rule.match]]
command = "bun run jest"
[[rule.match]]
command = "bun run test*"
[[rule.match]]
command = "bun run build*"
[[rule.match]]
command = "bun test*"
# jouet cannot tell that `web` in `pnpm --filter web build` is the option's value.
[[rule.match]]
command = "pnpm"
flags = ["--filter", "-F"]
args = ["tsc", "jest", "test*", "build*"]
[[rule.match]]
command = "pnpm tsc"
[[rule.match]]
command = "pnpm jest"
[[rule.match]]
command = "pnpm test*"
[[rule.match]]
command = "pnpm build*"
[[rule.match]]
command = "pnpm run tsc"
[[rule.match]]
command = "pnpm run jest"
[[rule.match]]
command = "pnpm run test*"
[[rule.match]]
command = "pnpm run build*"
[[rule.match]]
command = "npm run tsc"
[[rule.match]]
command = "npm run jest"
[[rule.match]]
command = "npm run test*"
[[rule.match]]
command = "npm run build*"
[[rule.match]]
command = "npm test*"
# npx, bunx and `bun x` hide the program from the matchers above.
[[rule.match]]
command = "npx"
text = ["^(playwright|stryker|tsc|jest)$"]
unless_args = ["install"]
[[rule.match]]
command = "bunx"
text = ["^(playwright|stryker|tsc|jest)$"]
unless_args = ["install"]
[[rule.match]]
command = "bun x"
text = ["^(playwright|stryker|tsc|jest)$"]
unless_args = ["install"]
[[rule.match]]
command = "pnpm exec"
text = ["^(playwright|stryker|tsc|jest)$"]
unless_args = ["install"]
[[rule.match]]
command = "pnpm dlx"
text = ["^(playwright|stryker|tsc|jest)$"]
unless_args = ["install"]
# jouet only warns on its own commands, even in deny mode.
[[rule.match]]
command = "jouet test"
text = ["^(cargo|playwright|stryker|hk|tsc|jest|yarn)$"]

[rule.examples]
fires = [
  "playwright test -c .config/playwright.config.ts",
  "cd web && vitest run --project browser",
  "bun run test:browser",
  "cd web && pnpm run test:contract",
  "cargo test --workspace",
  "mise x -- cargo clippy",
  "bunx playwright test",
  "hk check --all",
  "vitest run --project=browser",
  "pnpm exec playwright test",
  "bun install",
  "yarn tsc",
  "cd app && yarn tsc 2>&1 | tail -15",
  "CI=true yarn workspace backend test src/auth.test.ts",
  "yarn test:e2e",
  "npx tsc --noEmit",
  "tsc -p tsconfig.json",
  "jest --ci",
  "pnpm run tsc",
  "yarn",
  "bun test tests/unit/",
  "pnpm test",
  "pnpm --filter web build",
  "npm test",
  "npm run build",
  "bun run jest",
  "yarn install --immutable",
  "yarn build:backend",
  "yarn workspace app tsc",
  "jouet test --cmd -- yarn tsc",
]
quiet = [
  "hochet playwright test",
  "hochet bun run test:browser",
  "hochet cargo test --workspace",
  "hochet jouet test --cmd -- cargo test",
  "jouet test --affected",
  "cargo fmt",
  "vitest run --project unit",
  "bunx oxlint",
  "npx playwright install chromium",
  "hochet yarn tsc",
  "hochet yarn workspace backend test",
  "yarn prettier --check packages/app",
  "yarn workspace app lint",
  "yarn add zod",
  "yarn add -D jest",
  "yarn why jest",
  "yarn workspace app add tsc",
  "yarn eslint build",
  "yarn workspace build lint",
  "pnpm add -D jest",
  "npm view jest version",
  "bun add jest",
  "pnpm lint",
]

[[rule]]
name = "force"
why = "--force skips the queue: it is for a person at a terminal, who sees the machine's load."
mode = "deny"
scope = "plugin"
author = "setup-quality-tooling"
created = "2026-11-13"
message = "An agent waits for a slot: `--force` is for a person at a terminal. Run the command without --force; `hochet status` shows the queue."
suggest = "hochet <the command>"

[[rule.match]]
command = "hochet"
flags = ["--force"]

[rule.examples]
fires = ["hochet --force cargo test", "cd web && hochet --force playwright test"]
quiet = ["hochet cargo test", "hochet status"]
